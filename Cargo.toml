[package]
name = "mod-server-flags"
version = "2.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Server Flags for Horizon: the country each server in the Multiplayer list is hosted in."

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# No registry dependencies: the lookup runs the system's curl (src/flags.rs).
